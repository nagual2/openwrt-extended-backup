name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck on all scripts
        run: |
          shellcheck -s sh scripts/lib/common.sh
          shellcheck -s sh scripts/openwrt_full_backup
          shellcheck -s sh scripts/openwrt_restore
          shellcheck -s sh scripts/openwrt_full_restore
          shellcheck -s sh scripts/user_installed_packages

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Fix line endings and permissions
        run: |
          sudo apt-get install -y dos2unix
          find scripts tests -type f \( -name '*.sh' -o -name 'openwrt_*' -o -name 'user_installed*' -o -name '*.bats' -o -name '*.bash' \) -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Run Bats tests
        shell: 'script -q -e -c "bash {0}"'
        env:
          TERM: linux
        run: |
          make test USE_SYSTEM_TOOLS=1

  build-ipk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build IPK package
        run: |
          make ipk
          ls -la dist/

